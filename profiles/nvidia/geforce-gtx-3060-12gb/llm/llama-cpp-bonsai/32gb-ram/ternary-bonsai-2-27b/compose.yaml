services:
  llama-server:
    image: ${IMAGE}
    container_name: llama-server-bonsai
    pull_policy: missing
    restart: unless-stopped
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model /models/${MODEL_DIR}/${MODEL_FILE}
      - --host 0.0.0.0
      - --port 8080
      - -ngl 99
      - -fa on
      - -c 170000
      - --cache-type-k q4_0
      - --cache-type-v q4_0
      - --temp 1.0
      - --top-p 0.95
      - -top-k 20
      - -min-p 0.05
      - --jinja
    volumes:
      - ${MODELS_HOST_DIR}:/models:ro
    ports:
      - "11434:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
