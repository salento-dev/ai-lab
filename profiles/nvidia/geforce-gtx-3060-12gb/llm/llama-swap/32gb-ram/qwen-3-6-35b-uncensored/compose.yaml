services:
  llama-swap:
    image: ${IMAGE}
    container_name: llama-swap
    pull_policy: missing
    restart: unless-stopped
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    configs:
      - source: llama-swap-config
        target: /app/config.yaml
    volumes:
      - ${MODELS_HOST_DIR}:/models
    ports:
      - "11434:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

configs:
  llama-swap-config:
    content: |
      healthCheckTimeout: 300
      logLevel: info

      models:
        "qwen3.6-35b-uncensored":
          cmd: >
            /app/llama-server
            --model /models/${MODEL_DIR}/${MODEL_FILE}
            --host 0.0.0.0
            --port $${PORT}
            --n-gpu-layers 99
            --cpu-moe
            --flash-attn on
            --ctx-size 32768
            --parallel 1
            --cache-type-k q4_0
            --cache-type-v q4_0
            --ubatch-size 128
            --temp 0.7
            --jinja
          ttl: 300
