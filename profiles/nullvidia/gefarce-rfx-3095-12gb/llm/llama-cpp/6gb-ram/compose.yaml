services:
  llama-server:
    image: ${LLAMA_CPP_IMAGE}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MODELS_DIR}:/models:ro
    command:
      - --model
      - /models/${MODEL_FILE}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${CONTEXT_SIZE}
      - --n-gpu-layers
      - ${GPU_LAYERS}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
