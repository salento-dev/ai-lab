services:
  llama-swap:
    image: ${IMAGE}
    container_name: llama-swap
    pull_policy: always
    restart: unless-stopped
    tty: true
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - GGML_VK_VISIBLE_DEVICES=1
    devices:
      - /dev/dri:/dev/dri
    # Host-specific group IDs; check /dev/dri permissions and adjust.
    group_add:
      - "44"
      - "990"
    configs:
      - source: llama-swap-config
        target: /app/config.yaml
    volumes:
      - ${MODELS_HOST_DIR}:/models
    ports:
      - "11434:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

configs:
  llama-swap-config:
    content: |
      healthCheckTimeout: 300
      logLevel: info

      models:
        "qwen3-30b-a3b-instruct":
          name: "Qwen3 30B A3B Instruct 2507"
          cmd: >
            /app/llama-server
            --model /models/${MODEL_DIR}/${MODEL_FILE}
            --port $${PORT}
            --host 0.0.0.0
            --ctx-size 16384
            --n-gpu-layers 999
            --flash-attn on
            --jinja
          ttl: 300
