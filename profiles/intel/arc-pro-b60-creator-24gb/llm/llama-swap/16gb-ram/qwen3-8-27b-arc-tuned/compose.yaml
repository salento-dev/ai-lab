services:
  llama-swap:
    image: ${IMAGE}
    container_name: llama-swap
    pull_policy: always
    restart: unless-stopped
    tty: true
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - GGML_VK_VISIBLE_DEVICES=1
    devices:
      - /dev/dri:/dev/dri
    # Host-specific group IDs; check /dev/dri permissions and adjust.
    group_add:
      - "44"
      - "990"
    configs:
      - source: llama-swap-config
        target: /app/config.yaml
    volumes:
      - ${MODELS_HOST_DIR}:/models
    ports:
      - "11434:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

configs:
  llama-swap-config:
    content: |
      healthCheckTimeout: 300
      logLevel: info

      models:
        "qwen3.8-27b-b60":
          cmd: >
            /app/llama-server
            -m /models/${MODEL_DIR}/${MODEL_FILE}
            --mmproj /models/${MODEL_DIR}/${MMPROJ_FILE}
            --spec-type ngram-mod,draft-mtp
            --spec-ngram-mod-n-match 24
            --spec-ngram-mod-n-min 1
            --spec-ngram-mod-n-max 3
            --spec-draft-n-max 3
            --spec-draft-p-min 0.5
            -c 200000
            --cache-type-k q4_0
            --cache-type-v q4_0
            -ngl 99
            -ngld 99
            -fa on
            -ub 1024
            -b 1024
            -t 4
            -tb 6
            --jinja
            --chat-template-file /models/${MODEL_DIR}/${CHAT_TEMPLATE_FILE}
            --reasoning-preserve
            --host 0.0.0.0
            --port $${PORT}
          ttl: 300
